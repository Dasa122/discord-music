# LOCAL DEVELOPMENT ONLY — never deploy this file. It enables auth bypass and a placeholder control secret.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      BOT_CONTROL_HOST: 0.0.0.0
      DATABASE_URL: postgres://music:music@postgres:5432/music
      # Shared with the web service; supply it in `.env` (compose refuses to
      # start without it, so this file cannot run with a placeholder secret).
      BOT_CONTROL_SECRET: ${BOT_CONTROL_SECRET:?set BOT_CONTROL_SECRET in .env}
    volumes:
      - mediadata:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PUBLIC_BASE_URL: http://localhost:3000
      BOT_INTERNAL_URL: http://bot:3001
      BOT_CONTROL_SECRET: ${BOT_CONTROL_SECRET:?set BOT_CONTROL_SECRET in .env}
      DATABASE_URL: postgres://music:music@postgres:5432/music
      # Dev-only shortcut; production runs Authentik and leaves this unset.
      AUTH_DEV_BYPASS: "true"
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mediadata:
