name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    # Code scanning (SARIF upload) requires GitHub Advanced Security for private
    # repositories. Without this guard the job hard-fails on this private repo;
    # it activates automatically if the repo becomes public or moves to an org
    # with GHAS. Semgrep covers SAST in the meantime.
    if: ${{ !github.event.repository.private }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
